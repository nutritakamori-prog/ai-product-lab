services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_product_lab
      POSTGRES_PASSWORD: ai_product_lab
      POSTGRES_DB: ai_product_lab
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
